<style>
  :root {
    --bg: #171717;
    --card: #1f1f22;
    --card-hover: #26262a;
    --border: rgba(255, 255, 255, .1);
    --text: #ffffff;
    --text-dim: #a3a3a3;
    --primary: #116dff;
    --primary-dark: #0053d8;
    --secondary: #8b4cb7;
    --grad: linear-gradient(90deg, #116dff, #8b4cb7);
    --danger: #ff5c6c;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--primary); }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 14px 24px;
    background: rgba(23, 23, 23, .9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--text); }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--grad);
    display: grid; place-items: center; color: #fff;
  }
  .brand .logo svg { width: 20px; height: 20px; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  .brand-name .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    cursor: pointer; border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 18px; font-size: 12px; font-weight: 600; font-family: var(--font);
    color: var(--text); background: rgba(255, 255, 255, .06);
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, .12); border-color: var(--secondary); }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); border-color: transparent; color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); border-color: transparent; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: rgba(255, 92, 108, .12); border-color: var(--danger); }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: 6px 14px; font-size: 11px; }

  /* ---------- Layout ---------- */
  .layout { display: flex; min-height: calc(100vh - 63px); }

  /* ---------- Sidebar ---------- */
  aside {
    width: 270px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 22px 16px;
    position: sticky; top: 63px; height: calc(100vh - 63px);
    overflow-y: auto;
  }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-dim); margin-bottom: 12px;
  }
  .cat-list { display: flex; flex-direction: column; gap: 4px; }
  .cat {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
    color: var(--text-dim); font-size: 14px; font-weight: 500;
    background: none; border: none; font-family: inherit;
    transition: background .15s ease, color .15s ease;
    user-select: none;
  }
  .cat:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
  .cat.active { background: var(--grad); color: #fff; }
  .cat .cat-name {
    background: none; border: none; color: inherit; font: inherit; cursor: pointer;
    padding: 0; text-align: left; display: flex; align-items: center; gap: 8px;
    min-width: 0; flex: 1;
  }
  .cat .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .cat-name .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .count { font-size: 11px; background: rgba(255, 255, 255, .16); padding: 1px 8px; border-radius: 20px; flex-shrink: 0; }
  .cat.active .count { background: rgba(255, 255, 255, .25); }
  .cat .cat-tools { display: none; gap: 2px; flex-shrink: 0; }
  .cat:hover .cat-tools { display: inline-flex; }
  .cat-tool { background: none; border: none; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
  .cat-tool:hover { background: rgba(255, 255, 255, .22); }
  .add-cat { margin-top: 14px; width: 100%; }

  /* ---------- Main ---------- */
  main { flex: 1; padding: 40px 40px 100px; max-width: 920px; }

  .main-head { margin-bottom: 26px; }
  .main-head h1 { font-size: 34px; font-weight: 800; margin-bottom: 8px; }
  .main-head p { color: var(--text-dim); font-size: 15px; }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- Lista FAQ ---------- */
  .faq-list { display: flex; flex-direction: column; }
  .faq-item { border-bottom: 1px solid var(--border); user-select: none; cursor: grab; }
  .faq-item.dragging { opacity: .4; cursor: grabbing; }
  .faq-item.dragging .faq-a { pointer-events: none; }

  .faq-q {
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 20px 4px; color: var(--text);
    font-family: var(--font); font-size: 16px; font-weight: 600; line-height: 1.4;
    transition: color .15s ease;
  }
  .faq-q:hover { color: var(--secondary); }
  .faq-q .chev {
    margin-left: auto; flex-shrink: 0; width: 20px; height: 20px;
    transition: transform .25s ease; color: var(--secondary);
  }
  .faq-item.open .chev { transform: rotate(180deg); }

  .faq-a { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .faq-a-inner { padding: 0 4px 26px; color: var(--text-dim); font-size: 15px; }
  .faq-answer > * + * { margin-top: 8px; }
  .faq-answer b { color: var(--text); font-weight: 700; }

  .faq-images { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 4px; }
  .faq-images img {
    max-height: 220px; max-width: 100%; border-radius: 10px;
    border: 1px solid var(--border); cursor: zoom-in; object-fit: cover;
  }

  .faq-tools { display: flex; gap: 8px; margin-top: 18px; }

  .empty {
    text-align: center; color: var(--text-dim); padding: 60px 20px;
    border: 1px dashed var(--border); border-radius: 14px;
  }
  .empty strong { display: block; color: var(--text); margin-bottom: 6px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, .8);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; width: 100%; max-width: 640px;
    padding: 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  .field input[type=text],
  .field textarea,
  .field select {
    width: 100%; padding: 11px 13px; font-size: 14px; font-family: var(--font);
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
    transition: border-color .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--secondary); }
  .field textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 5px; }

  .editor-toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .ed-btn {
    cursor: pointer; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); border-radius: 8px; padding: 5px 13px;
    font-size: 12px; font-weight: 600; font-family: var(--font);
    transition: background .15s ease, border-color .15s ease;
  }
  .ed-btn:hover { background: var(--card-hover); border-color: var(--secondary); }
  .ed-btn b { font-weight: 700; }
  .editor-area {
    width: 100%; min-height: 150px; padding: 11px 13px; font-size: 15px;
    font-family: var(--font); color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
    transition: border-color .15s ease; overflow-y: auto; line-height: 1.5;
  }
  .editor-area:focus { border-color: var(--secondary); }
  .editor-area:empty::before { content: attr(placeholder); color: var(--text-dim); pointer-events: none; }

  .img-uploader { display: flex; flex-direction: column; gap: 10px; }
  .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .img-thumb {
    position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-thumb .rm {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
    border-radius: 50%; border: none; cursor: pointer;
    background: rgba(0, 0, 0, .7); color: #fff; font-size: 13px; line-height: 1;
    display: grid; place-items: center;
  }
  .img-thumb .rm:hover { background: var(--danger); }
  .file-input-label {
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 999px; border: 1px dashed var(--secondary);
    color: var(--secondary); font-size: 13px; font-weight: 600; width: fit-content;
  }
  .file-input-label:hover { background: rgba(139, 76, 183, .12); }
  .file-input-label input { display: none; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--grad); color: #fff; font-weight: 600; font-size: 14px;
    padding: 12px 22px; border-radius: 999px; z-index: 100; opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .92);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 8px; }
  .lightbox .close {
    position: absolute; top: 20px; right: 26px; width: 40px; height: 40px;
    border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
    background: rgba(255, 255, 255, .12); color: #fff; display: grid; place-items: center;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    aside {
      width: 100%; height: auto; position: static; border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .cat-list { flex-direction: row; flex-wrap: wrap; }
    main { padding: 24px 18px 80px; }
    .main-head h1 { font-size: 26px; }
    .header-actions .btn-ghost { display: none; }
  }
</style>
</head>

        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Annulla</button>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">

  <img id="lb-img" alt="">
</div>

<div class="toast" id="toast"></div>

let faqData = loadData();
let currentCat = "Tutte";
let editingId = null;
let pendingImages = [];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.items)) return parsed;
    }
  } catch (e) { /* dati corrotti → ricarica default */ }
  return JSON.parse(JSON.stringify(DEFAULT_FAQ));
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(faqData));
  } catch (e) {
    toast("Attenzione: spazio di archiviazione pieno. L'immagine potrebbe non essere stata salvata.");
  }
}

/* ============================================================
   UTILITY
   ============================================================ */
function uid() {
  return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ============================================================
   FORMATTAZIONE RISPOSTE
   ============================================================ */
function sanitizeHtml(html) {
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, "")
    .replace(/\son\w+="[^"]*"/gi, "")
    .replace(/javascript:[^"'\s]*/gi, "");
}

function renderAnswer(text) {
  if (!text) return "";
  if (/<[a-z][\s\S]*>/i.test(text)) return sanitizeHtml(text);
  return esc(text).replace(/\n/g, "<br>");
}

function storedToEditor(text) {
  if (!text) return "";
  if (/<[a-z][\s\S]*>/i.test(text)) return text;
  return esc(text).replace(/\n/g, "<br>");
}

function htmlToStored(html) {
  let h = String(html);
  h = h.replace(/<div[^>]*>/gi, "<br>").replace(/<\/div>/gi, "");
  h = h.replace(/<p[^>]*>/gi, "<br>").replace(/<\/p>/gi, "");
  h = h.replace(/^(<br\s*\/?>)+/i, "").replace(/(<br\s*\/?>)+$/i, "");
  return h;
}

function applySize(delta) {
  const area = document.getElementById("f-a");
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if (range.collapsed) return;
  let cur = 15;
  const el = range.startContainer.nodeType === 1
    ? range.startContainer : range.startContainer.parentElement;
  if (el) {
    const fs = parseFloat(getComputedStyle(el).fontSize);
    if (fs) cur = fs;
  }
  const next = Math.min(Math.max(Math.round(cur + delta), 11), 40);
  const span = document.createElement("span");
  span.style.fontSize = next + "px";
  span.appendChild(range.extractContents());
  range.insertNode(span);
  const r = document.createRange();
  r.selectNodeContents(span);
  sel.removeAllRanges();
  sel.addRange(r);
}

document.querySelectorAll(".ed-btn").forEach(btn => {
  btn.addEventListener("mousedown", e => e.preventDefault());
  btn.addEventListener("click", () => {
    const cmd = btn.dataset.cmd;
    const area = document.getElementById("f-a");
    area.focus();
    if (cmd === "bold") document.execCommand("bold", false, null);
    else if (cmd === "incsize") applySize(2);
    else if (cmd === "decsize") applySize(-2);
    else if (cmd === "remove") document.execCommand("removeFormat", false, null);
  });
});

    b.addEventListener("click", e => { e.stopPropagation(); renameCategory(b.dataset.rename); });

    b.addEventListener("click", e => { e.stopPropagation(); deleteCategory(b.dataset.del); });

function renderList() {
  const list = document.getElementById("faq-list");
  const items = faqData.items.filter(i => currentCat === "Tutte" || i.category === currentCat);

  if (items.length === 0) {
    list.innerHTML = `<div class="empty">
      <strong>Nessuna FAQ qui</strong>
      Clicca su “+ Aggiungi FAQ” per crearne una nuova.
    </div>`;
    return;
  }

  list.innerHTML = items.map(it => {
    const imgs = (it.images || []).map(src =>
      `<img src="${src}" alt="Immagine FAQ" loading="lazy">`).join("");
    return `
    <div class="faq-item" data-id="${it.id}" draggable="true">
      <button class="faq-q">
        <span>${esc(it.question)}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="faq-a">
        <div class="faq-a-inner">
          ${it.answer ? `<div class="faq-answer">${renderAnswer(it.answer)}</div>` : ""}
          ${imgs ? `<div class="faq-images">${imgs}</div>` : ""}
          <div class="faq-tools">
            <button class="btn btn-sm" data-edit="${it.id}">Modifica</button>
            <button class="btn btn-sm btn-danger" data-delitem="${it.id}">Elimina</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll(".faq-q").forEach(q => {
    q.addEventListener("click", () => {
      const item = q.closest(".faq-item");
      const body = item.querySelector(".faq-a");
      const isOpen = item.classList.contains("open");
      item.classList.toggle("open", !isOpen);
      body.style.maxHeight = isOpen ? "0px" : body.scrollHeight + "px";
    });
  });

  list.querySelectorAll("[data-edit]").forEach(b => {
    b.addEventListener("click", () => openModal(faqData.items.find(i => i.id === b.dataset.edit)));
  });
  list.querySelectorAll("[data-delitem]").forEach(b => {
    b.addEventListener("click", () => deleteItem(b.dataset.delitem));
  });
  list.querySelectorAll(".faq-images img").forEach(img => {
    img.addEventListener("click", () => openLightbox(img.src));
  });

  list.querySelectorAll(".faq-item").forEach(el => {
    el.addEventListener("dragstart", () => el.classList.add("dragging"));
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  list.addEventListener("dragover", e => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    const dragging = list.querySelector(".dragging");
    if (!dragging) return;
    const after = getDragAfterElement(list, e.clientY);
    if (after == null) list.appendChild(dragging);
    else list.insertBefore(dragging, after);
  });
  list.addEventListener("drop", e => e.preventDefault());
  list.addEventListener("dragend", () => commitOrder());
}

function getDragAfterElement(list, y) {
  const els = [...list.querySelectorAll(".faq-item:not(.dragging)")];
  let closest = { offset: -Infinity, element: null };
  for (const el of els) {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      closest = { offset, element: el };
    }
  }
  return closest.element;
}

function commitOrder() {
  const list = document.getElementById("faq-list");
  const newIds = [...list.querySelectorAll(".faq-item")].map(el => el.dataset.id);
  if (!newIds.length) return;
  const newSet = new Set(newIds);
  const byId = new Map(faqData.items.map(i => [i.id, i]));
  const result = [];
  let di = 0;
  for (const item of faqData.items) {
    if (newSet.has(item.id)) {
      if (di < newIds.length) result.push(byId.get(newIds[di]));
      di++;
    } else {
      result.push(item);
    }
  }
  newIds.forEach(id => {
    if (!result.some(i => i.id === id)) result.push(byId.get(id));
  });
  faqData.items = result;
  saveData();
}

function renderAll() { renderCats(); renderList(); updateTitle(); }

function updateTitle() {
  const title = document.getElementById("main-title");
  title.textContent = currentCat === "Tutte" ? "Tutte le domande" : currentCat;
}

/* ============================================================
   AZIONI — categorie
   ============================================================ */
function addCategory() {
  const name = prompt("Nome della nuova categoria:");
  if (!name) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  if (faqData.categories.includes(trimmed)) { toast("Categoria già esistente"); return; }
  faqData.categories.push(trimmed);
  saveData();
  currentCat = trimmed;
  renderAll();
  toast("Categoria aggiunta");
}

function renameCategory(name) {
  const newName = prompt("Nuovo nome per la categoria:", name);
  if (newName === null) return;
  const trimmed = newName.trim();
  if (!trimmed || trimmed === name) return;
  if (faqData.categories.includes(trimmed)) { toast("Esiste già una categoria con questo nome"); return; }
  const idx = faqData.categories.indexOf(name);
  if (idx === -1) return;
  faqData.categories[idx] = trimmed;
  faqData.items.forEach(i => { if (i.category === name) i.category = trimmed; });
  if (currentCat === name) currentCat = trimmed;
  saveData();
  renderAll();
  toast("Categoria rinominata");
}

function deleteCategory(name) {
  const items = faqData.items.filter(i => i.category === name).length;
  const target = faqData.categories.find(c => c !== name) || "Generals";
  const msg = items > 0
    ? `La categoria contiene ${items} FAQ che verranno spostate in "${target}". Eliminare comunque?`
    : `Eliminare la categoria "${name}"?`;
  if (!confirm(msg)) return;
  faqData.categories = faqData.categories.filter(c => c !== name);
  faqData.items.forEach(i => { if (i.category === name) i.category = target; });
  if (!faqData.categories.includes(target)) faqData.categories.unshift(target);
  if (currentCat === name) currentCat = "Tutte";
  saveData();
  renderAll();
  toast("Categoria eliminata");
}

/* ============================================================
   AZIONI — FAQ
   ============================================================ */
function deleteItem(id) {
  if (!confirm("Eliminare questa FAQ?")) return;
  faqData.items = faqData.items.filter(i => i.id !== id);
  saveData();
  renderAll();
  toast("FAQ eliminata");
}

  document.getElementById("f-a").innerHTML = storedToEditor(item ? item.answer : "");
  renderImgGrid();

  document.getElementById("modal").classList.add("show");
  document.getElementById("f-q").focus();
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
  document.getElementById("faq-form").reset();
  document.getElementById("f-a").innerHTML = "";
  editingId = null;
  pendingImages = [];
  renderImgGrid();
}

function renderImgGrid() {
  const grid = document.getElementById("img-grid");
  grid.innerHTML = pendingImages.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="anteprima">
      <button type="button" class="rm" data-rm="${i}" title="Rimuovi">×</button>
    </div>`).join("");
  grid.querySelectorAll(".rm").forEach(b => {
    b.addEventListener("click", () => {
      pendingImages.splice(+b.dataset.rm, 1);
      renderImgGrid();
    });
  });
}

document.getElementById("f-imgs").addEventListener("change", e => {
  const files = [...e.target.files];
  if (!files.length) return;
  files.forEach(file => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImages.push(reader.result);
      renderImgGrid();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = "";
});

document.getElementById("faq-form").addEventListener("submit", e => {
  e.preventDefault();
  const question = document.getElementById("f-q").value.trim();
  const answer = htmlToStored(document.getElementById("f-a").innerHTML).trim();
  const category = document.getElementById("f-cat").value;
  if (!question) { toast("Inserisci una domanda"); return; }

  if (editingId) {
    const it = faqData.items.find(i => i.id === editingId);
    if (it) {
      it.question = question;
      it.answer = answer;
      it.category = category;
      it.images = pendingImages;
    }
    toast("FAQ aggiornata");
  } else {
    faqData.items.push({ id: uid(), question, answer, category, images: pendingImages });
    toast("FAQ aggiunta");
  }
  saveData();
  closeModal();
  renderAll();
});

document.getElementById("modal-cancel").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

/* ============================================================
   BOTTONI TESTATA + LIGHTBOX
   ============================================================ */
document.getElementById("btn-add-faq").addEventListener("click", () => openModal(null));
document.getElementById("btn-add-cat").addEventListener("click", addCategory);

function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  document.getElementById("lb-img").src = src;
  lb.classList.add("show");
}
document.getElementById("lb-close").addEventListener("click", () =>
  document.getElementById("lightbox").classList.remove("show"));
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") document.getElementById("lightbox").classList.remove("show");
});

document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(faqData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "soundvertise-faq.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Dati esportati");
});

document.getElementById("btn-import").addEventListener("click", () =>
  document.getElementById("import-file").click());

document.getElementById("import-file").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.items)) throw new Error("bad");
      if (!confirm("Importare i dati sostituendo le FAQ correnti?")) return;
      faqData = parsed;
      if (!Array.isArray(faqData.categories)) faqData.categories = [];
      currentCat = "Tutte";
      saveData();
      renderAll();
      toast("Dati importati");
    } catch (err) {
      toast("File JSON non valido");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ============================================================
   INIT
   ============================================================ */
renderAll();
</script>
</body>
</html>
