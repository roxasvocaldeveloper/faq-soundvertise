<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ · Soundvertise</title>

<!--
  ============================================================
  FAQ SOUNDVERTISE — pagina autocon­tenuta (singolo file)
  ------------------------------------------------------------
  Come integrarla in soundvertise.co:
  1. Copia questo file nel tuo progetto.
  2. I dati vivono in localStorage (chiave "soundvertise_faq").
     Il contenuto iniziale è definito nella variabile DEFAULT_FAQ.
  3. Per rendere le FAQ pubbliche (solo lettura) sul sito, puoi:
     - rimuovere i pulsanti di modifica (sezione #admin-toolbar),
     - oppure estrarre DEFAULT_FAQ in un file JSON statico.
  Stili: usa le variabili CSS in :root per adattare i colori.
  Nessuna dipendenza esterna, JS vanilla.
  ============================================================
-->

<style>
  :root {
    --bg: #0f0e1a;
    --bg-soft: #171527;
    --card: #1c1930;
    --card-hover: #231f3d;
    --border: #2d2850;
    --text: #eceaf7;
    --text-dim: #9d98c0;
    --accent: #7c5cff;
    --accent-2: #ff5c9e;
    --accent-grad: linear-gradient(90deg, #7c5cff, #ff5c9e);
    --danger: #ff5c6c;
    --radius: 14px;
    --sidebar-w: 280px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }

  a { color: var(--accent); }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px;
    background: rgba(15, 14, 26, .85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: #fff;
  }
  .brand .logo svg { width: 22px; height: 22px; }
  .brand-name { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .brand-name span { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    cursor: pointer; border: none; border-radius: 10px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; font-family: var(--font);
    color: var(--text); background: var(--card); border: 1px solid var(--border);
    transition: transform .12s ease, background .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--card-hover); border-color: var(--accent); }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent-grad); border: none; color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: rgba(255, 92, 108, .12); border-color: var(--danger); }
  .btn-ghost { background: transparent; }
  .btn-ghost:hover { background: var(--card); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }

  /* ---------- Layout ---------- */
  .layout { display: flex; min-height: calc(100vh - 67px); }

  /* ---------- Sidebar ---------- */
  aside {
    width: var(--sidebar-w); flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 22px 16px;
    background: var(--bg-soft);
    position: sticky; top: 67px; height: calc(100vh - 67px);
    overflow-y: auto;
  }
  aside h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-dim); margin-bottom: 12px;
  }
  .cat-list { display: flex; flex-direction: column; gap: 4px; }
  .cat {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 12px; border-radius: 10px; cursor: pointer;
    color: var(--text-dim); font-size: 14px; font-weight: 500;
    transition: background .15s ease, color .15s ease;
    user-select: none;
  }
  .cat:hover { background: var(--card); color: var(--text); }
  .cat.active { background: var(--accent-grad); color: #fff; }
  .cat .cat-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cat .cat-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: .9; }
  .cat .count {
    font-size: 11px; background: rgba(255,255,255,.14); padding: 1px 8px;
    border-radius: 20px; flex-shrink: 0;
  }
  .cat .del-cat {
    display: none; border: none; background: none; color: inherit;
    cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 6px;
  }
  .cat:hover .del-cat { display: block; }
  .cat .del-cat:hover { background: rgba(255,255,255,.2); }
  .add-cat {
    margin-top: 14px; width: 100%;
  }

  /* ---------- Main ---------- */
  main { flex: 1; padding: 32px 40px 80px; max-width: 900px; }

  .main-head { margin-bottom: 24px; }
  .main-head h1 { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .main-head p { color: var(--text-dim); font-size: 15px; }
  .main-head .grad { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .faq-list { display: flex; flex-direction: column; gap: 14px; }

  /* ---------- FAQ item (accordion) ---------- */
  .faq-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color .2s ease;
  }
  .faq-item:hover { border-color: var(--accent); }
  .faq-item.open { border-color: var(--accent); }

  .faq-q {
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 18px 20px; color: var(--text);
    font-family: var(--font); font-size: 16px; font-weight: 600; line-height: 1.4;
  }
  .faq-q:hover { background: var(--card-hover); }
  .faq-q .chev {
    margin-left: auto; flex-shrink: 0; width: 22px; height: 22px;
    transition: transform .25s ease; color: var(--accent);
  }
  .faq-item.open .chev { transform: rotate(180deg); }
  .faq-cat-chip {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--accent);
    background: rgba(124, 92, 255, .12); border: 1px solid rgba(124, 92, 255, .35);
    padding: 2px 9px; border-radius: 30px;
  }

  .faq-a {
    max-height: 0; overflow: hidden;
    transition: max-height .3s ease;
  }
  .faq-a-inner { padding: 0 20px 20px; color: var(--text-dim); font-size: 15px; }

  .faq-a p + p { margin-top: 10px; }

  .faq-images { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
  .faq-images img {
    max-height: 220px; max-width: 100%; border-radius: 10px;
    border: 1px solid var(--border); cursor: zoom-in;
    object-fit: cover;
  }

  .faq-tools { display: flex; gap: 8px; margin-top: 16px; }

  .empty {
    text-align: center; color: var(--text-dim); padding: 60px 20px;
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty strong { display: block; color: var(--text); margin-bottom: 6px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(5, 4, 12, .75);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 16px; width: 100%; max-width: 640px;
    padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  .field input[type=text],
  .field textarea,
  .field select {
    width: 100%; padding: 11px 13px; font-size: 14px; font-family: var(--font);
    color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; outline: none;
    transition: border-color .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 5px; }

  .img-uploader { display: flex; flex-direction: column; gap: 10px; }
  .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .img-thumb {
    position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-thumb .rm {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
    border-radius: 50%; border: none; cursor: pointer;
    background: rgba(0,0,0,.7); color: #fff; font-size: 13px; line-height: 1;
    display: grid; place-items: center;
  }
  .img-thumb .rm:hover { background: var(--danger); }
  .file-input-label {
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--accent);
    color: var(--accent); font-size: 13.5px; font-weight: 600; width: fit-content;
  }
  .file-input-label:hover { background: rgba(124,92,255,.1); }
  .file-input-label input { display: none; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--accent-grad); color: #fff; font-weight: 600; font-size: 14px;
    padding: 12px 22px; border-radius: 30px; z-index: 100; opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 8px; }
  .lightbox .close {
    position: absolute; top: 20px; right: 26px; width: 40px; height: 40px;
    border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
    background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    aside {
      width: 100%; height: auto; position: static; border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .cat-list { flex-direction: row; flex-wrap: wrap; }
    main { padding: 24px 18px 70px; }
    .main-head h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="#">
    <span class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4l5-2V12l-5-2z"/><path d="M8 12h13"/><path d="M8 12v0a3 3 0 0 0 3 3h10"/></svg>
    </span>
    <span class="brand-name">Sound<span>vertise</span></span>
  </a>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="btn-export" title="Esporta i dati come file JSON">Esporta</button>
    <button class="btn btn-ghost btn-sm" id="btn-import" title="Importa i dati da file JSON">Importa</button>
    <input type="file" id="import-file" accept="application/json" hidden>
    <button class="btn btn-primary" id="btn-add-faq">+ Aggiungi FAQ</button>
  </div>
</header>

<div class="layout">
  <aside>
    <h2>Categorie</h2>
    <nav class="cat-list" id="cat-list"></nav>
    <button class="btn add-cat" id="btn-add-cat">+ Nuova categoria</button>
  </aside>

  <main>
    <div class="main-head">
      <h1>Domande <span class="grad">frequenti</span></h1>
      <p>Trova le risposte cliccando su una domanda. Puoi aggiungere, modificare o eliminare le FAQ e allegare immagini.</p>
    </div>
    <div class="faq-list" id="faq-list"></div>
  </main>
</div>

<!-- Modal aggiungi/modifica -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">Aggiungi FAQ</h3>
    <form id="faq-form" autocomplete="off">
      <div class="field">
        <label for="f-cat">Categoria</label>
        <select id="f-cat"></select>
      </div>
      <div class="field">
        <label for="f-q">Domanda</label>
        <input type="text" id="f-q" required placeholder="Scrivi la domanda…">
      </div>
      <div class="field">
        <label for="f-a">Risposta</label>
        <textarea id="f-a" placeholder="Scrivi la risposta…"></textarea>
      </div>
      <div class="field">
        <label>Immagini</label>
        <div class="img-uploader">
          <div class="img-grid" id="img-grid"></div>
          <label class="file-input-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Aggiungi immagine
            <input type="file" id="f-imgs" accept="image/*" multiple>
          </label>
          <div class="hint">JPG, PNG o GIF — verrà salvata direttamente nella pagina.</div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Annulla</button>
        <button type="submit" class="btn btn-primary">Salva</button>
      </div>
    </form>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lb-close">×</button>
  <img id="lb-img" alt="">
</div>

<div class="toast" id="toast"></div>

<script>

/* ============================================================
   DATI
   ============================================================ */

};

/* ============================================================
   STATO
   ============================================================ */
let faqData = loadData();
let currentCat = "Tutte";
let editingId = null;
let pendingImages = [];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.items)) return parsed;
    }
  } catch (e) { /* dati corrotti → ricarica default */ }
  return JSON.parse(JSON.stringify(DEFAULT_FAQ));
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(faqData));
  } catch (e) {
    toast("Attenzione: spazio di archiviazione pieno. L'immagine potrebbe non essere stata salvata.");
  }
}

/* ============================================================
   UTILITY
   ============================================================ */
function uid() {
  return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ============================================================
   RENDER — sidebar + lista
   ============================================================ */
function categoryCounts() {
  const counts = {};
  faqData.items.forEach(i => { counts[i.category] = (counts[i.category] || 0) + 1; });
  return counts;
}

function renderSidebar() {
  const nav = document.getElementById("cat-list");
  const counts = categoryCounts();
  const cats = ["Tutte", ...faqData.categories];
  nav.innerHTML = cats.map(cat => {
    const n = cat === "Tutte" ? faqData.items.length : (counts[cat] || 0);
    const icon = cat === "Tutte"
      ? `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`
      : `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>`;
    const del = (cat !== "Tutte")
      ? `<button class="del-cat" data-del="${esc(cat)}" title="Elimina categoria">×</button>` : "";
    return `<div class="cat ${cat === currentCat ? "active" : ""}" data-cat="${esc(cat)}">
      <span class="cat-name">${icon}<span>${esc(cat)}</span></span>
      <span class="count">${n}</span>${del}
    </div>`;
  }).join("");

  nav.querySelectorAll(".cat[data-cat]").forEach(el => {
    el.addEventListener("click", () => {
      currentCat = el.dataset.cat;
      renderSidebar();
      renderList();
    });
  });
  nav.querySelectorAll(".del-cat").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      deleteCategory(btn.dataset.del);
    });
  });
}

function renderList() {
  const list = document.getElementById("faq-list");
  const items = faqData.items.filter(i => currentCat === "Tutte" || i.category === currentCat);

  if (items.length === 0) {
    list.innerHTML = `<div class="empty">
      <strong>Nessuna FAQ qui</strong>
      Clicca su “+ Aggiungi FAQ” per crearne una nuova.
    </div>`;
    return;
  }

  list.innerHTML = items.map(it => {
    const imgs = (it.images || []).map((src, idx) =>
      `<img src="${src}" alt="Immagine FAQ" data-lb="${idx}" loading="lazy">`).join("");
    return `
    <div class="faq-item" data-id="${it.id}">
      <button class="faq-q">
        <span>${esc(it.question)}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="faq-a">
        <div class="faq-a-inner">
          ${it.answer ? `<p>${esc(it.answer).replace(/\n/g, "<br>")}</p>` : ""}
          ${imgs ? `<div class="faq-images">${imgs}</div>` : ""}
          <div class="faq-tools">
            <button class="btn btn-sm" data-edit="${it.id}">Modifica</button>
            <button class="btn btn-sm btn-danger" data-delitem="${it.id}">Elimina</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll(".faq-q").forEach(q => {
    q.addEventListener("click", () => {
      const item = q.closest(".faq-item");
      const body = item.querySelector(".faq-a");
      const isOpen = item.classList.contains("open");
      item.classList.toggle("open", !isOpen);
      body.style.maxHeight = isOpen ? "0px" : body.scrollHeight + "px";
    });
  });

  list.querySelectorAll("[data-edit]").forEach(b => {
    b.addEventListener("click", () => openModal(faqData.items.find(i => i.id === b.dataset.edit)));
  });
  list.querySelectorAll("[data-delitem]").forEach(b => {
    b.addEventListener("click", () => deleteItem(b.dataset.delitem));
  });
  list.querySelectorAll(".faq-images img").forEach(img => {
    img.addEventListener("click", () => openLightbox(img.src));
  });
}

function renderAll() { renderSidebar(); renderList(); }

/* ============================================================
   AZIONI — categorie
   ============================================================ */
function addCategory() {
  const name = prompt("Nome della nuova categoria:");
  if (!name) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  if (faqData.categories.includes(trimmed)) { toast("Categoria già esistente"); return; }
  faqData.categories.push(trimmed);
  saveData();
  renderSidebar();
  currentCat = trimmed;
  renderSidebar(); renderList();
  toast("Categoria aggiunta");
}

function deleteCategory(name) {
  const items = faqData.items.filter(i => i.category === name).length;
  const msg = items > 0
    ? `La categoria contiene ${items} FAQ che verranno spostate in "Generals". Eliminare comunque?`
    : `Eliminare la categoria "${name}"?`;
  if (!confirm(msg)) return;
  faqData.categories = faqData.categories.filter(c => c !== name);
  faqData.items.forEach(i => { if (i.category === name) i.category = "Generals"; });
  if (!faqData.categories.includes("Generals")) faqData.categories.unshift("Generals");
  if (currentCat === name) currentCat = "Tutte";
  saveData();
  renderAll();
  toast("Categoria eliminata");
}

/* ============================================================
   AZIONI — FAQ
   ============================================================ */
function deleteItem(id) {
  if (!confirm("Eliminare questa FAQ?")) return;
  faqData.items = faqData.items.filter(i => i.id !== id);
  saveData();
  renderAll();
  toast("FAQ eliminata");
}

/* ============================================================
   MODAL — aggiungi/modifica
   ============================================================ */
function openModal(item) {
  editingId = item ? item.id : null;
  pendingImages = item && item.images ? [...item.images] : [];

  document.getElementById("modal-title").textContent = item ? "Modifica FAQ" : "Aggiungi FAQ";
  const catSel = document.getElementById("f-cat");
  catSel.innerHTML = faqData.categories.map(c =>
    `<option value="${esc(c)}" ${item && item.category === c ? "selected" : ""}>${esc(c)}</option>`
  ).join("");
  // Se non c'è categoria selezionata (nuova FAQ), imposta quella corrente (se non è "Tutte")
  if (!item && currentCat !== "Tutte" && faqData.categories.includes(currentCat)) {
    catSel.value = currentCat;
  }
  document.getElementById("f-q").value = item ? item.question : "";
  document.getElementById("f-a").value = item ? item.answer : "";
  renderImgGrid();

  document.getElementById("modal").classList.add("show");
  document.getElementById("f-q").focus();
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
  document.getElementById("faq-form").reset();
  editingId = null;
  pendingImages = [];
  renderImgGrid();
}

function renderImgGrid() {
  const grid = document.getElementById("img-grid");
  grid.innerHTML = pendingImages.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="anteprima">
      <button type="button" class="rm" data-rm="${i}" title="Rimuovi">×</button>
    </div>`).join("");
  grid.querySelectorAll(".rm").forEach(b => {
    b.addEventListener("click", () => {
      pendingImages.splice(+b.dataset.rm, 1);
      renderImgGrid();
    });
  });
}

document.getElementById("f-imgs").addEventListener("change", e => {
  const files = [...e.target.files];
  if (!files.length) return;
  files.forEach(file => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImages.push(reader.result);
      renderImgGrid();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = "";
});

document.getElementById("faq-form").addEventListener("submit", e => {
  e.preventDefault();
  const question = document.getElementById("f-q").value.trim();
  const answer = document.getElementById("f-a").value.trim();
  const category = document.getElementById("f-cat").value;
  if (!question) { toast("Inserisci una domanda"); return; }

  if (editingId) {
    const it = faqData.items.find(i => i.id === editingId);
    if (it) {
      it.question = question;
      it.answer = answer;
      it.category = category;
      it.images = pendingImages;
    }
    toast("FAQ aggiornata");
  } else {
    faqData.items.push({ id: uid(), question, answer, category, images: pendingImages });
    toast("FAQ aggiunta");
  }
  saveData();
  closeModal();
  renderAll();
});

document.getElementById("modal-cancel").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

/* ============================================================
   BOTTONI TESTATA + LIGHTBOX
   ============================================================ */
document.getElementById("btn-add-faq").addEventListener("click", () => openModal(null));
document.getElementById("btn-add-cat").addEventListener("click", addCategory);

function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  document.getElementById("lb-img").src = src;
  lb.classList.add("show");
}
document.getElementById("lb-close").addEventListener("click", () =>
  document.getElementById("lightbox").classList.remove("show"));
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") document.getElementById("lightbox").classList.remove("show");
});

document.getElementById("btn-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(faqData, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "soundvertise-faq.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Dati esportati");
});

document.getElementById("btn-import").addEventListener("click", () =>
  document.getElementById("import-file").click());

document.getElementById("import-file").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.items)) throw new Error("bad");
      if (!confirm("Importare i dati sostituendo le FAQ correnti?")) return;
      faqData = parsed;
      if (!Array.isArray(faqData.categories)) faqData.categories = [];
      currentCat = "Tutte";
      saveData();
      renderAll();
      toast("Dati importati");
    } catch (err) {
      toast("File JSON non valido");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ============================================================
   INIT
   ============================================================ */
renderAll();
</script>
</body>
</html>
